name: temporal_101

services:
  postgresql:
    image: postgres:18.4
    container_name: temporal-postgresql
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    ports:
      - "5432:5432"
    volumes:
      - temporal-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - temporal-101-network

  temporal:
    image: temporalio/auto-setup:1.29.7
    container_name: temporal
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql

      - DEFAULT_NAMESPACE_RETENTION=24h
    ports:
      - "7233:7233"
    networks:
      - temporal-101-network

  temporal-ui:
    image: temporalio/ui:2.53.3
    container_name: temporal-ui
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8080:8080"
    networks:
      - temporal-101-network

  temporal-admin-tools:
    image: temporalio/admin-tools:1.30
    container_name: temporal-admin-tools
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    stdin_open: true
    tty: true
    networks:
      - temporal-101-network

volumes:
  temporal-postgres-data:

networks:
  temporal-101-network:
    driver: bridge